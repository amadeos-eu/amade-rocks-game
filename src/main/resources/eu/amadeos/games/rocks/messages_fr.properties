dialog.about.text=Les rochers classiques dans l'espace : tournez, accélérez, tirez, et ne laissez jamais un rocher toucher votre vaisseau.
dialog.about.rules=Un tir brise un grand rocher en deux moyens, un moyen en deux petits et un petit en poussière ; plus il est petit, plus il rapporte. Quatre tirs volent à la fois. Le terrain n'a pas de bords : ce qui le quitte d'un côté revient de l'autre. L'hyperespace envoie le vaisseau à un endroit au hasard, peut-être juste à côté d'un rocher. Tous les 10 000 points, un vaisseau de plus. P met en pause, F11 passe en plein écran et en revient.
