dialog.about.text=The classic rocks in space: turn, thrust and shoot, and never let a rock hit your ship.
dialog.about.rules=A hit breaks a large rock into two medium ones, a medium one into two small ones, and a small one into dust; the smaller, the more points. Four shots fly at a time. The field has no edges: what leaves it on one side comes back on the other. Hyperspace takes the ship to a random place, perhaps right next to a rock. Every 10,000 points give an extra ship. P pauses, F11 switches to full screen and back.
