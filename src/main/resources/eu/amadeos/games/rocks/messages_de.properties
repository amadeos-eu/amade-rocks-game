dialog.about.text=Die klassischen Felsbrocken im All: Drehen, Schub geben, schießen, und nie einen Brocken ans Schiff lassen.
dialog.about.rules=Ein Treffer bricht einen großen Brocken in zwei mittlere, einen mittleren in zwei kleine und einen kleinen zu Staub; je kleiner, desto mehr Punkte. Vier Schüsse fliegen gleichzeitig. Das Feld hat keine Ränder: Was es auf einer Seite verlässt, kommt auf der anderen zurück. Der Hyperraum bringt das Schiff an einen zufälligen Ort, vielleicht direkt neben einen Brocken. Alle 10.000 Punkte gibt es ein Schiff dazu. P hält an, F11 schaltet ins Vollbild und zurück.
