dialog.about.text=Las rocas clásicas del espacio: gire, acelere y dispare, y no deje nunca que una roca toque su nave.
dialog.about.rules=Un disparo rompe una roca grande en dos medianas, una mediana en dos pequeñas y una pequeña en polvo; cuanto más pequeña, más puntos. Vuelan cuatro disparos a la vez. El campo no tiene bordes: lo que sale por un lado vuelve por el otro. El hiperespacio lleva la nave a un lugar al azar, quizá justo al lado de una roca. Cada 10.000 puntos dan una nave más. P pausa, F11 cambia a pantalla completa y vuelve.
