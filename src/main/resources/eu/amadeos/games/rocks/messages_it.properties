dialog.about.text=I classici asteroidi nello spazio: gira, spingi e spara, e non lasciare mai che un asteroide colpisca la tua nave.
dialog.about.rules=Un colpo rompe un asteroide grande in due medi, uno medio in due piccoli e uno piccolo in polvere; più è piccolo, più punti dà. Volano quattro colpi alla volta. Il campo non ha bordi: ciò che esce da un lato rientra dall'altro. L'iperspazio porta la nave in un punto a caso, magari proprio accanto a un asteroide. Ogni 10.000 punti una nave in più. P mette in pausa, F11 passa allo schermo intero e torna indietro.
